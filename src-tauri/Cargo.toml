[package]
name = "vsparallel"
version = "0.1.0"
description = "A compact local monitor for VS Code workspaces and coarse Codex or Claude Code activity"
authors = ["VSParallel contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "vsparallel_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "vsparallel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
tempfile = "3.27.0"
