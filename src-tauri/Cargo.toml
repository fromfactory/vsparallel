[package]
name = "vsparallel"
version = "1.0.0"
description = "A compact local monitor for VS Code, Cursor, Antigravity, and Zed workspaces and agent activity"
authors = ["Yuki Furuta"]
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
publish = false
repository = "https://github.com/fromfactory/vsparallel"
readme = "../README.md"

[lib]
name = "vsparallel_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "vsparallel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
httparse = "1.10.1"
libc = "0.2.189"
rusqlite = { version = "0.40.1", default-features = false, features = ["blob", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tempfile = "3.27.0"
time = { version = "0.3.54", features = ["parsing"] }
zstd = { version = "=0.13.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "time"] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
