[package]
name = "vsparallel"
version = "0.2.0"
description = "A compact local monitor for VS Code and Antigravity workspaces and agent activity"
authors = ["VSParallel contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "vsparallel_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "vsparallel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["blob", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tempfile = "3.27.0"
time = { version = "0.3.54", features = ["parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
