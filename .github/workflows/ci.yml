name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Check ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Compile desktop UI
        run: npm run build:ui

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            shellcheck \
            xdg-utils

      - name: Install pinned license-notice generator
        if: runner.os == 'Linux'
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Install pinned Rust advisory scanner
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run full repository checks
        if: runner.os == 'Linux'
        run: ./scripts/check.sh

      - name: Audit locked dependencies
        if: runner.os == 'Linux'
        run: |
          cargo audit
          npm audit --audit-level=high
          npm --prefix website audit --audit-level=high

      - name: Lint native Rust code
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test native Rust code
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

      - name: Install website dependencies
        if: runner.os == 'Linux'
        run: npm ci
        working-directory: website

      - name: Build website
        if: runner.os == 'Linux'
        run: npm run build
        working-directory: website

      - name: Package companion extension
        if: runner.os == 'Linux'
        run: python3 companion/package_vsix.py
