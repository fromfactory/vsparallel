name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag and application versions
        shell: bash
        run: |
          config_version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')
          cargo_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' src-tauri/Cargo.toml)
          updater_pubkey=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json", encoding="utf-8")).get("plugins", {}).get("updater", {}).get("pubkey", ""))')

          if [[ "$GITHUB_REF_NAME" != "v$config_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Tauri version $config_version"
            exit 1
          fi
          if [[ "$cargo_version" != "$config_version" ]]; then
            echo "::error::src-tauri/Cargo.toml ($cargo_version) and tauri.conf.json ($config_version) disagree"
            exit 1
          fi
          if [[ ! "$config_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The stable release workflow does not publish prerelease or build-metadata versions"
            exit 1
          fi
          if [[ -z "$updater_pubkey" ]]; then
            echo "::error::Configure plugins.updater.pubkey before creating the first release"
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install pinned license-notice generator
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Install pinned Rust advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            shellcheck \
            xdg-utils

      - name: Run repository checks
        run: ./scripts/check.sh

      - name: Audit locked dependencies
        run: |
          cargo audit
          npm audit --audit-level=high
          npm --prefix website audit --audit-level=high

      - name: Package VS Code companion
        run: python3 companion/package_vsix.py

      - name: Stage companion package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-companion
          path: dist/*.vsix
          if-no-files-found: error
          overwrite: true

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Linux x86-64
            os: ubuntu-22.04
            artifact: linux-x86_64
          - name: macOS universal
            os: macos-latest
            artifact: macos-universal
          - name: Windows x86-64
            os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            shellcheck \
            xdg-utils

      - name: Run native Rust tests
        if: runner.os != 'Linux'
        shell: bash
        run: |
          npm run build:ui
          cargo test --workspace --locked

      - name: Install pinned Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Build Linux release package
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./scripts/build-bundles.sh --config src-tauri/tauri.release.conf.json --bundles deb \
            2>&1 | tee "$RUNNER_TEMP/tauri-build.log"

      - name: Build Windows release package
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./scripts/build-bundles.sh --config src-tauri/tauri.release.conf.json \
            2>&1 | tee "$RUNNER_TEMP/tauri-build.log"

      - name: Build universal macOS packages
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Ad-hoc signing is sufficient for the initial, unnotarized builds.
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./scripts/build-bundles.sh --config src-tauri/tauri.release.conf.json \
            --target universal-apple-darwin \
            2>&1 | tee "$RUNNER_TEMP/tauri-build.log"

      - name: Verify updater signing key
        shell: bash
        run: |
          if grep -Fq 'does not match the public key' "$RUNNER_TEMP/tauri-build.log"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY does not match plugins.updater.pubkey"
            exit 1
          fi

      - name: Collect Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/release
          cp target/release/bundle/deb/*.deb dist/release/
          cp target/release/bundle/deb/*.deb.sig dist/release/

      - name: Collect macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/release
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/release/
          cp target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz dist/release/
          cp target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig dist/release/

      - name: Collect Windows package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/release
          cp target/release/bundle/nsis/*-setup.exe dist/release/
          cp target/release/bundle/nsis/*-setup.exe.sig dist/release/

      - name: Stage release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.artifact }}
          path: dist/release/*
          if-no-files-found: error
          overwrite: true

  publish:
    name: Prepare draft GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create updater manifest
        shell: bash
        run: |
          python3 scripts/create-update-manifest.py \
            --assets release-assets \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --output release-assets/latest.json

      - name: Create release checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS

      - name: Verify release packages
        shell: bash
        run: |
          for pattern in \
            '*.deb' '*.deb.sig' \
            '*.dmg' '*.app.tar.gz' '*.app.tar.gz.sig' \
            '*-setup.exe' '*-setup.exe.sig' \
            '*.vsix' 'latest.json' 'SHA256SUMS'; do
            if ! compgen -G "release-assets/$pattern" > /dev/null; then
              echo "::error::Missing release asset matching $pattern"
              exit 1
            fi
          done

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if release_is_draft=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq .isDraft 2> /dev/null); then
            if [[ "$release_is_draft" == "false" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; use a new version and tag"
              exit 1
            fi
            if [[ "$release_is_draft" != "true" ]]; then
              echo "::error::Unexpected draft state: $release_is_draft"
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "VSParallel $GITHUB_REF_NAME" \
              --generate-notes \
              --notes "These initial packages are not production code signed or notarized. macOS Gatekeeper and Windows SmartScreen warnings are expected; see docs/releases.md for details."
          fi

          # A rerun must not retain obsolete assets from an earlier draft.
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' > "$RUNNER_TEMP/existing-release-assets"
          while IFS= read -r asset_name; do
            if [[ -n "$asset_name" ]]; then
              gh release delete-asset "$GITHUB_REF_NAME" "$asset_name" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            fi
          done < "$RUNNER_TEMP/existing-release-assets"

          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          find release-assets -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-release-assets"
          if ! cmp -s \
            "$RUNNER_TEMP/expected-release-assets" \
            "$RUNNER_TEMP/actual-release-assets"; then
            echo "::error::Draft release assets do not exactly match the verified build output"
            diff -u \
              "$RUNNER_TEMP/expected-release-assets" \
              "$RUNNER_TEMP/actual-release-assets" || true
            exit 1
          fi
          echo "Draft release $GITHUB_REF_NAME is ready for package smoke tests and manual publication."
